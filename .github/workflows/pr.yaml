name: Pull Request Checks

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: application/requirements-dev.txt

    - name: Install Dependencies
      run: pip install -r requirements-dev.txt
      working-directory: application

    - name: Run Tests
      run: pytest -q
      working-directory: application

  terraform-eks:
    runs-on: ubuntu-latest
    env:
      TF_WORKING_DIR: terraform-eks
      AWS_REGION: us-east-1

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.13.3

    - name: Inicializar Terraform
      run: terraform init

    - name: Verificar Formatação
      run: terraform fmt -check -recursive

    - name: Validar Configuração
      run: terraform validate

    - name: Executar Terraform Plan
      id: plan
      run: |
        terraform plan -no-color -lock-timeout=5m | tee plan.txt
        echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      continue-on-error: true

    - name: Comentar na PR
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = `${process.env.TF_WORKING_DIR}/plan.txt`;
          const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(0, 60000) : 'Plan não disponível.';
          const output = `#### Terraform Plan 📝
          \`\`\`hcl
          ${plan}
          \`\`\`
          `;
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });

    - name: Falhar se o Plan Falhou
      if: steps.plan.outputs.exitcode != '0'
      run: exit 1
