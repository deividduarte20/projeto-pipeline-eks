name: Build, Deploy and Smoke Test

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: new-comments
  EKS_CLUSTER_NAME: devops-cluster

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set immutable image URI
      id: image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        echo "uri=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Build and Push Docker Image
      env:
        IMAGE_URI: ${{ steps.image.outputs.uri }}
      run: |
        docker build --pull -t "${IMAGE_URI}" .
        docker push "${IMAGE_URI}"
      working-directory: application

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.13.3

    - name: Terraform Init and Plan
      run: |
        terraform -chdir=terraform-eks init
        terraform -chdir=terraform-eks plan -lock-timeout=5m -out=tfplan

    - name: Terraform Apply
      run: terraform -chdir=terraform-eks apply -auto-approve tfplan

    - name: Read Terraform Outputs
      run: |
        echo "CERTIFICATE_ARN=$(terraform -chdir=terraform-eks output -raw certificate_arn)" >> "$GITHUB_ENV"

    - name: Update Kubeconfig
      run: |
        aws eks --region "${AWS_REGION}" update-kubeconfig --name "${EKS_CLUSTER_NAME}"
        chmod 600 ~/.kube/config

    - name: Install Metrics Server
      run: |
        kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml

    - name: Deploy Application Manifests
      run: |
        kubectl create namespace app --dry-run=client -o yaml | kubectl apply -f -
        sed "s|__IMAGE_URI__|${IMAGE_URI}|g" manifests/deployment.yaml | kubectl apply -f -
        kubectl apply -f manifests/service.yaml
        kubectl apply -f manifests/hpa.yaml
        sed "s|__CERTIFICATE_ARN__|${CERTIFICATE_ARN}|g" manifests/ingress.yaml | kubectl apply -f -

    - name: Wait for Application Rollout
      run: |
        kubectl rollout status deployment/api-new-comments -n app --timeout=180s

    - name: Smoke Test Application
      run: |
        kubectl exec -n app deployment/api-new-comments -- python -c "import urllib.request; urllib.request.urlopen('http://svc-new-comments:8000/health', timeout=5)"

    - name: Install Helm
      uses: azure/setup-helm@v4

    - name: Deploy Prometheus and Grafana
      env:
        GRAFANA_ADMIN_PASSWORD: ${{ secrets.PASSWD_GRAFANA }}
      run: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
        helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
          --namespace monitoring \
          --create-namespace \
          --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName=gp2 \
          --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage=10Gi \
          --set prometheus.prometheusSpec.resources.requests.cpu=500m \
          --set prometheus.prometheusSpec.resources.requests.memory=1Gi \
          --set prometheus.prometheusSpec.resources.limits.cpu=1000m \
          --set prometheus.prometheusSpec.resources.limits.memory=2Gi \
          --set grafana.persistence.enabled=true \
          --set grafana.persistence.storageClassName=gp2 \
          --set grafana.persistence.size=10Gi \
          --set grafana.adminPassword="${GRAFANA_ADMIN_PASSWORD}"

    - name: Deploy Grafana Dashboard
      run: |
        kubectl apply -f manifests/grafana-dashboard.yaml

    - name: Deploy Monitoring Ingresses
      run: |
        sed "s|__CERTIFICATE_ARN__|${CERTIFICATE_ARN}|g" manifests/prometheus-ingress.yaml | kubectl apply -f -
        sed "s|__CERTIFICATE_ARN__|${CERTIFICATE_ARN}|g" manifests/grafana-ingress.yaml | kubectl apply -f -

    - name: Deploy ServiceMonitor
      run: |
        kubectl wait --for=condition=established crd/servicemonitors.monitoring.coreos.com --timeout=120s
        kubectl apply -f manifests/servicemonitor.yaml
